; Access Transformers let this mod reach private/protected members of game classes
; without editing the auto-generated C++ stubs in Source/FactoryGame/.
; Docs: https://docs.ficsit.app/satisfactory-modding/latest/Development/ModLoader/AccessTransformers.html
;
; Nothing is needed. The mod hooks nothing, and the one non-public member it touches
; (UFGItemDescriptor::mCachedStackSize) is a UPROPERTY, so it is reached by reflection in
; StackSizeSyncSubsystem.cpp instead. That is deliberate: transformers are injected into
; FactoryGame's own headers at build time, so adding an entry here rebuilds the entire
; FactoryGame module (~329 actions) rather than just this mod.
;
; If a hook target ever turns out to be private/protected, add a Friend entry, e.g.:
;   Friend=(Class="UFGInventoryComponent", FriendClass="FStackResizerSplitFixModule")
[AccessTransformers]
